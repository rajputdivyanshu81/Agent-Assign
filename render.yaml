services:
  - type: web
    name: minerva-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MINERVA_HEADLESS
        value: "true"
      - key: MINERVA_BROWSER_USER_DATA_DIR
        value: /tmp/minerva-browser
